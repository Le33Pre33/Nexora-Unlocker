[package]
name = "nexora-unlocker"
version = "0.3.0"
edition = "2021"
description = "Nexora Unlocker: разблокировка и массовые операции над занятыми файлами в Windows"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
trash = "5"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
